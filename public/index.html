<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hangout</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="join-screen">
    <div class="join-box">
      <h1>hangout</h1>
      <input type="text" id="username" placeholder="username" autocomplete="off" maxlength="15">
      <input type="text" id="room" placeholder="room code" autocomplete="off" maxlength="10">
      
      <div class="color-picker">
        <label><input type="radio" name="color" value="#ffb3ba" checked><span class="swatch" style="background: #ffb3ba"></span></label>
        <label><input type="radio" name="color" value="#ffdfba"><span class="swatch" style="background: #ffdfba"></span></label>
        <label><input type="radio" name="color" value="#ffffba"><span class="swatch" style="background: #ffffba"></span></label>
        <label><input type="radio" name="color" value="#baffc9"><span class="swatch" style="background: #baffc9"></span></label>
        <label><input type="radio" name="color" value="#bae1ff"><span class="swatch" style="background: #bae1ff"></span></label>
      </div>

      <button id="join-btn">join room</button>
    </div>
  </div>

  <div id="game-container" class="hidden">
    <div id="grid-world"></div>
    
    <div id="ui-layer">
      <div id="chat-box">
        <div id="chat-messages"></div>
        <input type="text" id="chat-input" placeholder="say something..." autocomplete="off">
      </div>
      
      <div id="mobile-dpad">
        <button class="dpad-btn up" data-dir="up">^</button>
        <button class="dpad-btn left" data-dir="left"><</button>
        <button class="dpad-btn right" data-dir="right">></button>
        <button class="dpad-btn down" data-dir="down">v</button>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
