<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>hangout</title>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;700&display=swap" rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="/hangout.svg">
  <script src="https://www.youtube.com/iframe_api"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <div id="join-screen">
    <form id="join-form" class="join-box">
      <h1>hangout</h1>
      <input type="text" id="username" placeholder="username" autocomplete="off" maxlength="15">
      <input type="text" id="room" placeholder="room code" autocomplete="off" maxlength="10">
      
      <div class="color-picker">
        <label><input type="radio" name="color" value="#bae1ff" checked><span class="swatch" style="background: #bae1ff"></span></label>
        <label><input type="radio" name="color" value="#baffc9"><span class="swatch" style="background: #baffc9"></span></label>
        <label><input type="radio" name="color" value="#ffffba"><span class="swatch" style="background: #ffffba"></span></label>
        <label><input type="radio" name="color" value="#ffdfba"><span class="swatch" style="background: #ffdfba"></span></label>
        <label><input type="radio" name="color" value="#ffb3ba"><span class="swatch" style="background: #ffb3ba"></span></label>
      </div>

      <button type="submit" id="join-btn">join room</button>
    </form>
  </div>

  <div id="game-container" class="hidden">
    <div id="grid-world"></div>
    
    <div id="ui-layer">
      <div id="url-modal" class="hidden">
        <div class="join-box">
          <h2>paste youtube link</h2>
          <input type="text" id="yt-url-input" placeholder="https://youtube.com/..." autocomplete="off">
          <div style="display: flex; gap: 10px; margin-top: 10px;">
            <button id="start-party-btn">start</button>
            <button id="cancel-party-btn" style="background: var(--text-color-muted);">cancel</button>
          </div>
        </div>
      </div>

      <div id="ui-top">
        <div id="move-label">use wasd or arrow keys to move</div>
        <div id="swipe-label">swipe anywhere to move</div>
      </div>

      <div id="video-overlay" class="hidden">
        <div id="yt-player"></div>
      </div>

      <div id="ui-bottom">
        <div id="chat-box">
          <div id="chat-messages"></div>
          <input type="text" id="chat-input" placeholder="say something..." autocomplete="off">
        </div>
        
        <div id="action-stack">
          <button id="close-video-btn" class="stack-btn hidden">x close party</button>
          <button id="watch-party-btn" class="stack-btn">watch party</button>
          <button id="leave-btn">leave <span id="room-display"></span></button>
        </div>
      </div>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="app.js"></script>
</body>
</html>
